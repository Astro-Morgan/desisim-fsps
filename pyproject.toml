[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demiurge"
version = "0.1.0.dev0"
description = "Ground-up simulator + NPE-parameter sampling framework for synthetic DESI-like spectra with known additive ground-truth decomposition, part of the DESI-Flow framework."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.rst" }
dynamic = ["dependencies"]

[project.optional-dependencies]
torch = ["torch"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]
